<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 800" width="1640" height="800" role="img" aria-labelledby="t d">
<title id="t">AlphaStack 계층과 의존 — 의존은 아래로만 흐른다</title>
<desc id="d">아래에서부터 common, ingest, supply, features, models 가 한 줄로 쌓여 위층이 아래층에만 기댄다. supply 에는 as_of 정문과 봉인 입구 두 문이 있다. evaluation 은 이 줄 밖에 따로 서서 models 가 아니라 포지션·수익률 배열만 받으므로 models 를 import 하지 않는다. backtest 와 timeseries 도 그 옆에 선다. dashboard 는 맨 위에서 전부를 쓴다. features·models·evaluation 이 ingest 를 직접 import 하면 경계 시험이 막는다.</desc>

<!-- ─────────────────────────────────────────────────────────────────────────
     AlphaStack 계층·의존도 — 이 SVG 가 정본이다.

     왜 mermaid 를 쓰지 않았나: 자동 배치가 common 과 금지 경로의 점선을 캔버스
     오른쪽으로 크게 휘감아 돌리고, 세로가 가로의 1.2배로 늘어나 README 에서
     작게 줄어들었다 (2026-09-20 실측 1568×1880). 계층도는 사람이 층을 정해 두는
     그림이라 손 배치가 자동 배치보다 낫다. mermaid 판은 그대로 남아 있다 —
     docs/아키텍처/version1.3/계층아키텍처.mmd

     다크 판(alphastack-layers.dark.svg)은 아래 <style> 의 색 값 여덟 개만 다르다.
     색 토큰 대조표는 alphastack-pipeline.light.svg 머리에 있는 것과 같다.
     ───────────────────────────────────────────────────────────────────────── -->
<style>
  .bg      { fill: #ffffff }
  .ink     { fill: #1f2328 }
  .ink2    { fill: #59636e }
  .ink3    { fill: #8c959f }
  .accent  { fill: #1f6feb }
  .panel   { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.5 }
  .starBox { fill: #ddf4ff; stroke: #1f6feb; stroke-width: 2.5 }
  .innerBox{ fill: #ffffff; stroke: #1f6feb; stroke-width: 1.5 }
  .sealBox { fill: none;    stroke: #1f6feb; stroke-width: 1.5; stroke-dasharray: 6 5; opacity: .85 }
  .noteBox { fill: none;    stroke: #d1d9e0; stroke-width: 1.5; stroke-dasharray: 5 4 }
  .flow    { stroke: #8c959f; stroke-width: 2.5; fill: none }
  .flowA   { stroke: #1f6feb; stroke-width: 2.5; fill: none }
  .flowDash{ stroke: #8c959f; stroke-width: 2; fill: none; stroke-dasharray: 6 5 }
  .rule    { stroke: #d1d9e0; stroke-width: 1.5 }
  .spine   { stroke: #d1d9e0; stroke-width: 2.5; fill: none }

  text { font-family: Pretendard, "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", system-ui, sans-serif }
  .h1    { font-size: 26px; font-weight: 700; letter-spacing: -.6px }
  .h1 tspan.q { fill: #1f6feb }
  .sub   { font-size: 14px }
  .name  { font-size: 17.5px; font-weight: 700; letter-spacing: -.3px }
  .body  { font-size: 13.5px }
  .small { font-size: 12.5px }
  .edge  { font-size: 12.5px }
  .zone  { font-size: 12px; font-weight: 700; letter-spacing: .8px }
</style>

<rect class="bg" x="0" y="0" width="1640" height="800"/>

<!-- 머리 -->
<text class="h1 ink" x="60" y="40">계층과 의존 — <tspan class="q">의존은 아래로만 흐른다</tspan></text>
<text class="sub ink2" x="60" y="64">파란 테두리 = 이 프로젝트가 따로 만든 장치 · 줄 수는 2026-09-20 실측(추적 파일)</text>
<line class="rule" x1="60" y1="78" x2="1580" y2="78"/>

<defs>
  <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/>
  </marker>
  <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f6feb"/>
  </marker>
</defs>

<!-- 맨 위 — 전부를 쓰는 층 -->
<rect class="panel" x="60" y="96" width="1520" height="64" rx="12"/>
<text class="name ink" x="84" y="124">dashboard/</text>
<text class="body ink2" x="220" y="124">Streamlit Overview + 9페이지 — HF 개발본을 받아 화면 안에서 돈다</text>
<text class="small ink3" x="84" y="146">9,603줄 · 아래 전부를 쓴다</text>
<text class="small ink3" x="1556" y="146" text-anchor="end">deploy/hf-space · Docker</text>

<!-- ── 왼쪽 기둥: 의존 사슬 ────────────────────────────────────── -->
<text class="zone ink3" x="60" y="186">의존 사슬 — 위층은 바로 아래층에만 기댄다</text>

<rect class="panel" x="60" y="200" width="500" height="76" rx="12"/>
<text class="name ink" x="84" y="228">models/</text>
<text class="body ink2" x="84" y="250">표 → 등락 방향 분류기 · 최종 C · K LogReg</text>
<text class="small ink3" x="536" y="228" text-anchor="end">2,855줄</text>

<path class="flow" d="M 310 276 L 310 302" marker-end="url(#a1)"/>
<text class="edge ink3" x="326" y="294">X, y 를 받는다</text>

<rect class="panel" x="60" y="306" width="500" height="76" rx="12"/>
<text class="name ink" x="84" y="334">features/</text>
<text class="body ink2" x="84" y="356">기술적 지표 → X, y · 조합 A~K</text>
<text class="small ink3" x="536" y="334" text-anchor="end">3,291줄</text>

<path class="flow" d="M 310 382 L 310 408" marker-end="url(#a1)"/>
<text class="edge ink3" x="326" y="400">정문을 통과한 행만</text>

<rect class="starBox" x="60" y="412" width="500" height="146" rx="14"/>
<text class="name accent" x="84" y="440">supply/ — 문은 둘</text>
<text class="small ink3" x="536" y="440" text-anchor="end">5,353줄</text>
<rect class="innerBox" x="84" y="452" width="452" height="44" rx="8"/>
<text class="body ink" x="100" y="472">as_of 정문</text>
<text class="small ink2" x="196" y="472">행 T 에 보이는 것은 known_at ≤ T 인 것뿐</text>
<text class="small ink3" x="100" y="489">개발구간 ~2024-08-31 · 늘 열려 있다</text>
<rect class="sealBox" x="84" y="502" width="452" height="44" rx="8"/>
<text class="body accent" x="100" y="522">봉인 입구</text>
<text class="small ink2" x="196" y="522">홀드아웃 478거래일 · 단 한 번</text>
<text class="small ink3" x="100" y="539">reports/unseal.log 가 정확히 1줄일 때만</text>

<path class="flow" d="M 310 558 L 310 584" marker-end="url(#a1)"/>
<text class="edge ink3" x="326" y="576">internal — 안에서만 부른다</text>

<rect class="panel" x="60" y="588" width="500" height="96" rx="12"/>
<text class="name ink" x="84" y="616">ingest/</text>
<text class="body ink2" x="84" y="638">clients/ 응답을 정규화 · store/ 원문 bytes 보존</text>
<text class="small ink3" x="84" y="660">SQLite 하나 · krx_cache.db · v16 · 표 23개 · 6,685 MB</text>
<text class="small ink3" x="536" y="616" text-anchor="end">16,151줄</text>

<path class="flow" d="M 310 684 L 310 710" marker-end="url(#a1)"/>
<text class="edge ink3" x="326" y="702">설정 · 경로 · 거래일</text>

<rect class="panel" x="60" y="714" width="500" height="66" rx="12"/>
<text class="name ink" x="84" y="742">common/</text>
<text class="body ink2" x="84" y="764">설정 · 경로 · 자격증명 · 거래일 — 아무것도 import 하지 않는다</text>
<text class="small ink3" x="536" y="742" text-anchor="end">3,838줄</text>

<!-- ── 오른쪽: 사슬 밖에 서는 것들 ─────────────────────────────── -->
<text class="zone ink3" x="620" y="186">사슬 밖 — 무엇이 만들었는지 모른 채 잰다</text>

<rect class="starBox" x="620" y="200" width="520" height="146" rx="14"/>
<text class="name accent" x="644" y="228">evaluation/</text>
<text class="small ink3" x="1116" y="228" text-anchor="end">9,226줄</text>
<text class="body ink2" x="644" y="252">예측 → 믿어도 되는가</text>
<text class="small ink2" x="644" y="274">워크포워드 gap · 학습 최빈 기준선 · MDD · Sharpe · 거래비용</text>
<text class="small accent" x="644" y="300">models 를 import 하지 않는다 — 실측 0건</text>
<text class="small ink3" x="644" y="322">받는 것은 포지션 배열과 수익률 배열뿐이라</text>
<text class="small ink3" x="644" y="339">2 · 3차가 그대로 가져다 쓴다</text>

<path class="flowA" d="M 564 238 L 616 238" marker-end="url(#a2)"/>
<text class="edge accent" x="590" y="226" text-anchor="middle">배열만</text>

<rect class="panel" x="620" y="376" width="520" height="86" rx="12"/>
<text class="name ink" x="644" y="404">backtest/</text>
<text class="body ink2" x="644" y="426">A · B · C 분할매매 · 비용 민감도</text>
<text class="small ink3" x="644" y="448">models 의 예측과 supply 의 가격을 받는다</text>
<text class="small ink3" x="1116" y="404" text-anchor="end">1,270줄</text>

<rect class="panel" x="620" y="492" width="520" height="86" rx="12"/>
<text class="name ink" x="644" y="520">timeseries/</text>
<text class="body ink2" x="644" y="542">numpy 로 손수 짠 ARIMA · ADF · ACF/PACF</text>
<text class="small ink3" x="644" y="564">사슬과 나란히 선다 — 분류기가 겨룰 통계적 기준선</text>
<text class="small ink3" x="1116" y="520" text-anchor="end">2,085줄</text>

<rect class="panel" x="620" y="608" width="520" height="86" rx="12"/>
<text class="name ink" x="644" y="636">pipelines.refresh</text>
<text class="body ink2" x="644" y="658">수집 → 게이트 → 반출 → HF 를 8단계로 묶는다</text>
<text class="small ink3" x="644" y="680">잠금과 run_id 로 두 번 돌지 않게 한다</text>
<text class="small ink3" x="1116" y="636" text-anchor="end">960줄</text>

<!-- ── 맨 오른쪽: 막힌 길과 규약 ───────────────────────────────── -->
<text class="zone ink3" x="1200" y="186">막힌 길</text>

<rect class="noteBox" x="1200" y="200" width="380" height="146" rx="14"/>
<text class="body ink" x="1224" y="228">features · models · evaluation 이</text>
<text class="body ink" x="1224" y="250">ingest 를 직접 import 하면</text>
<text class="name accent" x="1224" y="282">시험이 막는다</text>
<text class="small ink3" x="1224" y="306">tests/test_supply_boundary.py</text>
<text class="small ink3" x="1224" y="328">자료를 꺼내는 문은 supply 하나뿐이다</text>

<path class="flowDash" d="M 1196 262 L 1148 262"/>
<line class="flow" x1="1166" y1="250" x2="1178" y2="274"/>

<text class="zone ink3" x="1200" y="398">지켜지는 방식</text>
<text class="small ink2" x="1200" y="424">· 층을 건너뛰는 import 는 시험이 잡는다</text>
<text class="small ink2" x="1200" y="446">· 봉인 입구는 기록이 2줄이 되면 거부한다</text>
<text class="small ink2" x="1200" y="468">· 반출 전에 검증기가 먼저 돈다</text>
<text class="small ink2" x="1200" y="490">· 숫자는 잰 것만 적는다 — 아니면 “미측정”</text>

<text class="zone ink3" x="1200" y="536">깊이 보려면</text>
<text class="small ink2" x="1200" y="562">docs/핵심코드/version1.4/ — 줄 단위 해설 7편</text>
<text class="small ink2" x="1200" y="584">docs/아키텍처/version1.3/ — 전문과 구성도</text>

<line class="rule" x1="1200" y1="620" x2="1580" y2="620"/>
<text class="small ink3" x="1200" y="646">정본 docs/media/architecture/</text>
<text class="small ink3" x="1200" y="664">alphastack-layers.light.svg</text>
<text class="small ink3" x="1200" y="690">mermaid 판은 계층아키텍처.mmd 에 남아 있다</text>
</svg>
