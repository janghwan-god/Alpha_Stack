<line class="rule" x1="40" y1="432" x2="1600" y2="432"/>
<text class="small ink3" x="40" y="458">실선 = 늘 흐르는 길 · 파란 점선 = 한 번만 열리는 길</text>
<text class="small ink3" x="40" y="478">숫자는 2026-09-20 실측 (읽기 전용으로 연 krx_cache.db · 추적 파일)</text>
<text class="small ink3" x="1600" y="458" text-anchor="end">팀 Qurious · 1차 프로젝트 2026-09-01 ~ 09-15</text>
